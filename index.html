<style>

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--bg); border-bottom: 1px solid var(--line); }

  .langs { display: flex; gap: 5px; flex-wrap: wrap; }

    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }

  main { max-width: 1080px; margin: 0 auto; padding: 0 20px 60px; }
  section { padding: 56px 0; border-bottom: 1px solid var(--line); }
  section:last-of-type { border-bottom: 0; }
  h1 { margin: 0 0 18px; font-size: clamp(28px, 5.4vw, 46px); line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
  h2 { margin: 0 0 24px; font-size: clamp(21px, 3.4vw, 30px); line-height: 1.4; }
  h3 { margin: 0 0 8px; font-size: 18px; }
  p { margin: 0 0 14px; }
  .lead { font-size: clamp(16px, 2.2vw, 19px); color: var(--muted); max-width: 60ch; }

  .hero > div:first-child { flex: 999 1 340px; min-width: 0; }
  .hero > aside { flex: 1 1 290px; min-width: 0; }
  .kicker { display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: 1.2px;

  .cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 22px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 54px;
    padding: 0 28px; border-radius: 10px; text-decoration: none; font-size: 17px; font-weight: 600;
    background: var(--teal); color: #fff; border: 1px solid var(--teal); }
  .btn:hover { background: var(--teal-d); border-color: var(--teal-d); }
  .btn.ghost { background: transparent; color: var(--teal); }
  .btn.gold { background: var(--gold-l); border-color: var(--gold-l); color: #2E2305; }
  .cta small { font-size: 14px; color: var(--muted); }

  .sample { border: 1px solid var(--line); border-radius: 16px; padding: 24px; background: var(--bg); }
  .sample .tag { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--muted); }
  .sample strong { display: block; font-size: 19px; margin: 6px 0 2px; }
  .sample .sub { font-size: 15px; color: var(--muted); }
  .sample hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .sample .rule { font-size: 14.5px; line-height: 1.65; color: var(--ink); }

  .steps { display: flex; flex-wrap: wrap; gap: 20px; list-style: none; margin: 0; padding: 0; counter-reset: s; }
  .steps li { flex: 1 1 260px; min-width: 0; background: var(--soft); border-radius: 14px; padding: 26px; }
  .steps li::before { counter-increment: s; content: counter(s, decimal-leading-zero);
    display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px;
    border-radius: 20px; background: var(--teal); color: #fff; font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  .steps p { margin: 0; font-size: 15.5px; color: var(--muted); }

  .prices { display: flex; flex-wrap: wrap; gap: 16px; }
  .prices > div { flex: 1 1 210px; min-width: 0; border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .prices > div.main { border: 2px solid var(--teal); background: var(--soft); }
  .prices .amt { display: block; font-size: 27px; font-weight: 700; margin: 6px 0; }
  .prices .desc { font-size: 14px; color: var(--muted); }
  .prices .soon { display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: 11px;

  details.faq summary { cursor: pointer; font-size: 17px; font-weight: 600; list-style: none; }
  details.faq summary::-webkit-details-marker { display: none; }
  details.faq summary::after { content: "+"; float: right; color: var(--teal); font-weight: 400; }
  details.faq[open] summary::after { content: "−"; }
  details.faq p { margin: 12px 0 0; color: var(--muted); font-size: 15.5px; }

  .close { background: var(--teal); border-radius: 18px; padding: 44px 32px; color: #fff;
    display: flex; flex-wrap: wrap; gap: 22px; align-items: center; justify-content: space-between; }
  .close h2 { margin: 0 0 6px; color: #fff; }
  .close p { margin: 0; color: #D7E6E5; }

  footer { max-width: 1080px; margin: 0 auto; padding: 26px 20px 44px; border-top: 1px solid var(--line);

  @media (max-width: 420px) {
    main { padding: 0 14px 44px; }
    section { padding: 40px 0; }
    .hero { gap: 26px; padding-top: 32px; }
    .steps li, .prices > div { padding: 18px; }
    .close { padding: 30px 20px; }
    .bar .inner { padding: 10px 14px; }
  }
</style>
</head>

  var ORDER = ["ja", "zh-TW", "zh-CN", "en", "ko"];
  var HTML_LANG = { ja: "ja", "zh-TW": "zh-Hant", "zh-CN": "zh-Hans", en: "en", ko: "ko" };
  var lang = "ja";

  // 저장값 → URL 파라미터 → 브라우저 설정 순으로 결정
  try { var sv = localStorage.getItem("cb-lang"); if (sv && T[sv]) lang = sv; } catch (e) {}
  var p = (location.search.match(/[?&]lang=([^&]+)/) || [])[1];
  if (p && T[decodeURIComponent(p)]) lang = decodeURIComponent(p);
  else if (!(function () { try { return localStorage.getItem("cb-lang"); } catch (e) { return null; } })()) {
    var nav = (navigator.language || "ja").toLowerCase();
    if (nav.indexOf("ko") === 0) lang = "ko";
    else if (nav.indexOf("zh-tw") === 0 || nav.indexOf("zh-hant") === 0 || nav.indexOf("zh-hk") === 0) lang = "zh-TW";
    else if (nav.indexOf("zh") === 0) lang = "zh-CN";
    else if (nav.indexOf("ja") === 0) lang = "ja";
    else lang = "en";
  }

  function t(k) { return (T[lang] && T[lang][k]) || T.ja[k] || ""; }

  var box = document.getElementById("langs");
  box.innerHTML = ORDER.map(function (l) {
    return "<button type='button' data-l='" + l + "' lang='" + HTML_LANG[l] + "'>" + T[l].label + "</button>";
  }).join("");

  function apply() {
    document.documentElement.lang = HTML_LANG[lang];
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (el) {
      el.textContent = t(el.getAttribute("data-t"));
    });
    Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-l") === lang ? "true" : "false");
    });
    try { localStorage.setItem("cb-lang", lang); } catch (e) {}
  }

  Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-l"); apply(); });
  });

  apply();
})();
</script>
