    padding-bottom: env(safe-area-inset-bottom, 0px);

  * { box-sizing: inherit; }
  body { margin: 0; background: var(--bg); color: var(--ink);

  .page { max-width: 560px; margin: 0 auto; padding: 0 18px 72px; }
  header { padding: 22px 0 8px; display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between; }
  .brand { font-size: 18px; font-weight: 800; color: var(--teal);
    display: inline-flex; align-items: center; gap: 9px; text-decoration: none; }
  .brand::before { content: ""; width: 9px; height: 9px; border-radius: 5px; background: var(--coral); }
  .langs { display: flex; flex-wrap: wrap; gap: 5px; }
  .langs button { font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    min-height: 36px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); }
  .langs button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }

  h1 { font-size: 25px; line-height: 1.35; margin: 16px 0 6px; }
  .lead { color: var(--muted); font-size: 15px; margin: 0 0 20px; }

  .tabs { display: flex; gap: 8px; margin: 0 0 18px; }
  .tabs button { flex: 1; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    min-height: 46px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 18px; }
  label.f { display: block; margin: 0 0 16px; }
  label.f > span.k { display: block; font-size: 14px; font-weight: 700; margin: 0 0 6px; }
  label.f > span.opt { font-weight: 400; color: var(--muted); }
  input, textarea { width: 100%; font-family: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 13px; min-height: 48px; }
  textarea { min-height: 160px; resize: vertical; line-height: 1.6; }
  input:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: var(--teal); }
  .btn { width: 100%; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    min-height: 52px; border-radius: 11px; border: 0; background: var(--coral); color: #fff; }
  .btn:hover { background: var(--coral-d); }
  .btn:disabled { background: #D8D3CD; cursor: default; }
  .btn.alt { background: var(--teal); }
  .btn.alt:hover { background: var(--teal-d); }

  .err { color: var(--bad); font-size: 14px; margin: 6px 0 0; }
  .note { background: var(--warm); color: var(--warmink); border-radius: 11px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.6; margin: 16px 0 0; }
  .note a { color: inherit; }

  .code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 22px; font-weight: 700; letter-spacing: 1px; color: var(--teal);
    background: var(--mist); border-radius: 10px; padding: 14px; text-align: center; margin: 12px 0; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .row button { flex: 0 0 auto; min-width: 104px; }

  .thread { margin-top: 4px; }
  .bubble { border-radius: 12px; padding: 14px 15px; margin: 0 0 12px; }
  .bubble.q { background: var(--mist); }
  .bubble.a { background: #EAF4F2; border: 1px solid #CFE4E0; }
  .bubble h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 700; }
  .bubble p { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .when { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .pill { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px;
    border-radius: 12px; font-size: 12.5px; font-weight: 700; }
  .pill.new { background: var(--warm); color: var(--warmink); }
  .pill.ans { background: #E3F1EE; color: #0D534F; }

  .mine { margin-top: 18px; font-size: 13.5px; color: var(--muted); }
  .mine b { color: var(--ink); }
  .mine button { font-family: inherit; font-size: 13px; cursor: pointer; background: none;
    border: 0; color: var(--teal); text-decoration: underline; padding: 4px 2px; min-height: 32px; }

  footer { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 12px; }

/* 유입 경로 기억(30일): 처음 들어온 페이지·이전 사이트·홍보 꼬리표(utm). 예약 요청을 보낼 때만 함께 전송된다. */
(function () {
  try {
    var K = "tc-src", now = Date.now(), q = new URLSearchParams(location.search), u = {}, old = null, ref = "";
    ["utm_source", "utm_medium", "utm_campaign"].forEach(function (k) { var v = q.get(k); if (v) u[k.slice(4)] = v.slice(0, 60); });
    try { old = JSON.parse(localStorage.getItem(K) || "null"); } catch (e) {}
    try { var r = document.referrer && new URL(document.referrer); if (r && r.hostname !== location.hostname) ref = r.hostname; } catch (e) {}
    if (!old || now - (old.t || 0) > 2592e6 || u.source) {
      localStorage.setItem(K, JSON.stringify({ lp: location.pathname.slice(0, 100), ref: ref, utm: u, t: now }));
    }
  } catch (e) {}
})();

      var h0 = document.createElement("div");
      h0.innerHTML = "<b>" + L("mineAcct") + "</b>";
      box.appendChild(h0);
      acctList.forEach(function (q) {
        var b = document.createElement("button");
        b.type = "button";
        b.style.display = "block";
        b.style.textAlign = "left";
        b.textContent = q.subject + "  ·  " +
          (q.status === "new" ? L("stNew") : q.status === "closed" ? L("stClosed") : L("stAnswered"));
        b.addEventListener("click", function () { openCode(q.inquiry_code); });
        box.appendChild(b);
      });
    }

    /* 이 기기에 남은 코드 */
    var a = myCodes();
    if (!a.length) return;
    var h = document.createElement("div");
    h.style.marginTop = acctList && acctList.length ? "10px" : "0";
    h.innerHTML = "<b>" + L("mineT") + "</b>";
    box.appendChild(h);
    a.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = c;
      b.addEventListener("click", function () { openCode(c); });
      box.appendChild(b);
    });
  }

  /* 로그인했으면 코드 없이도 자기 문의를 불러온다 */
  function loadAccount() {
    if (!window.supabase) return;
    try { sb = window.supabase.createClient(cfg.url, cfg.key); } catch (e) { return; }
    sb.auth.getSession().then(function (res) {
      session = res.data && res.data.session;
      if (!session) return;
      if (!$("email").value) $("email").value = session.user.email || "";
      return rpc("my_inquiries", {}, session.access_token).then(function (rows) {
        acctList = rows || [];
        drawMine();
      });
    }).catch(function () {});
  }

  /* ---------- 문의 보내기 ---------- */
  function showErr(id, msg) {
    var el = $(id);
    if (!msg) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false; el.textContent = msg;
  }

  $("send").addEventListener("click", function () {
    var btn = this;
    var email = $("email").value.trim();
    var subject = $("subject").value.trim();
    var body = $("body").value.trim();
    var ref = $("ref").value.trim();

    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showErr("errNew", L("errEmail")); $("email").focus(); return; }
    if (!subject) { showErr("errNew", L("errSubj")); $("subject").focus(); return; }
    if (!body)    { showErr("errNew", L("errBody")); $("body").focus(); return; }
    showErr("errNew", "");

    btn.disabled = true; btn.textContent = L("sending");
    rpc("create_inquiry", { p_email: email, p_subject: subject, p_body: body,
                            p_lang: lang, p_lookup_code: ref || null },
        session ? session.access_token : null)
      .then(function (code) {
        if (!code) throw new Error("no code");
        remember(code);
        $("newCode").textContent = code;
        $("paneNew").hidden = true;
        $("paneDone").hidden = false;
        $("subject").value = ""; $("body").value = ""; $("ref").value = "";
        try {
          fetch(cfg.url + "/functions/v1/notify", {
            method: "POST",
            headers: { "Content-Type": "application/json", "apikey": cfg.key },
            body: JSON.stringify({ kind: "inquiry", code: code, lang: lang }),
            keepalive: true
          }).catch(function () {});
        } catch (e) {}
      })
      .catch(function (e) {
        var m = String((e && e.code) || "");
        showErr("errNew",
          m.indexOf("too_many") >= 0 ? L("errTooMany") :
          m.indexOf("invalid_email") >= 0 ? L("errEmail") : L("failed"));
      })
      .then(function () { btn.disabled = false; btn.textContent = L("submit"); });
  });

  /* ---------- 코드 복사 ---------- */
  $("copyCode").addEventListener("click", function () {
    var btn = this, txt = $("newCode").textContent;
    function done() { btn.textContent = L("copied"); setTimeout(function () { btn.textContent = L("copy"); }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
    } else { fallbackCopy(txt, done); }
  });
  function fallbackCopy(text, done) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) {}
  }

  /* ---------- 조회 ---------- */
  var shown = null;

  function fmt(iso) {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleString(lang === "ko" ? "ko-KR" : lang === "ja" ? "ja-JP" : lang,
        { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit" }) + " KST";
    } catch (e) { return iso.slice(0, 16).replace("T", " ") + " KST"; }
  }

  function drawThread(q) {
    var box = $("thread");
    box.innerHTML = "";

    var pill = document.createElement("span");
    pill.className = "pill " + (q.status === "new" ? "new" : "ans");
    pill.textContent = q.status === "new" ? L("stNew") : q.status === "closed" ? L("stClosed") : L("stAnswered");
    box.appendChild(pill);

    var qb = document.createElement("div");
    qb.className = "bubble q";
    qb.style.marginTop = "12px";
    var h1 = document.createElement("h3"); h1.textContent = L("yourQ");
    var t1 = document.createElement("p"); t1.textContent = q.subject + "\n\n" + q.body;
    var w1 = document.createElement("div"); w1.className = "when"; w1.textContent = fmt(q.created_at);
    qb.appendChild(h1); qb.appendChild(t1); qb.appendChild(w1);
    box.appendChild(qb);

    if (q.reply) {
      var ab = document.createElement("div");
      ab.className = "bubble a";
      var h2 = document.createElement("h3"); h2.textContent = L("ourA");
      var t2 = document.createElement("p"); t2.textContent = q.reply;
      var w2 = document.createElement("div"); w2.className = "when"; w2.textContent = fmt(q.replied_at);
      ab.appendChild(h2); ab.appendChild(t2); ab.appendChild(w2);
      box.appendChild(ab);
    } else {
      var n = document.createElement("div");
      n.className = "note";
      n.textContent = L("waiting");
      box.appendChild(n);
    }
  }

  function look() {
    var code = $("code").value.trim().toUpperCase();
    if (!code) return;
    showErr("errCheck", "");
    $("thread").innerHTML = "";
    rpc("get_inquiry", { p_code: code })
      .then(function (rows) {
        var q = rows && rows.length ? rows[0] : null;
        if (!q) { showErr("errCheck", L("notFound")); shown = null; return; }
        shown = q;
        remember(q.inquiry_code);
        drawMine();
        drawThread(q);
      })
      .catch(function () { showErr("errCheck", L("failed")); });
  }
  $("look").addEventListener("click", look);
  $("code").addEventListener("keydown", function (e) { if (e.key === "Enter") look(); });

  /* ---------- 시작 ---------- */
  applyLang();
  loadAccount();
  var h = (location.hash || "").replace("#", "").trim().toUpperCase();
  if (h) { tab("check"); $("code").value = h; look(); } else { tab("new"); }
})();
</script>
</body>
</html>
