  }

  function condText(x) {
    if (!x) return "";
    if (typeof x === "string") return "";   // 옛 한국어 데이터는 숨긴다
    if (x.k === "time_limit") return L("cTimeLimit").replace("{n}", x.v);
    if (x.k === "seat_type") return L("cSeatType").replace("{v}", x.v);
    return "";
  }

  function mapClean(arr, fn) {
    return (arr || []).map(fn).filter(function (s) { return s; });
  }

  /* 운영자가 이 식당에 직접 저장한 가이드를 우선 쓴다.
     없으면 업종으로 추측한 기본 문구를 보여준다. */
  /* 가이드를 언제 확인했는지 — 연·월까지만 보여준다 */
  function asOfText(venue) {
    var u = venue && venue.guide_updated_at;
    if (!u) return "";
    var d = new Date(u), s;
    try {
      s = new Intl.DateTimeFormat(
        { ja: "ja-JP", "zh-TW": "zh-TW", "zh-CN": "zh-CN", en: "en-US", ko: "ko-KR" }[lang] || "ja-JP",
        { year: "numeric", month: "long" }).format(d);
    } catch (e) {
      s = d.getFullYear() + "." + (d.getMonth() + 1);
    }
    return L("guideAsOf").replace("{d}", s);
  }

  function guideFor(venue) {
    var list = window.CB_GUIDE || [];
    var out = [];

    var keys = (venue && venue.guide_keys) || [];
    keys.forEach(function (k) {
      var g = list.filter(function (x) { return x.k === k; })[0];
      if (g) out.push(g[lang] || g.ko);
    });

    var t = venue && venue.guide_extra_t;
    if (t && t[lang]) out.push(t[lang]);

    if (out.length) return out.slice(0, 8);

    var cat = venue ? venue.category : "";
    var g = GUIDE_T[lang] || GUIDE_T.ja;
    if (!cat) return g.base;
    if (/갈비|구이|등심|삼겹|고기/.test(cat)) return g.galbi;
    if (/한식|국밥|백반|찌개|탕/.test(cat)) return g.hansik;
    return g.base;
  }

  /* 취소할 수 있는 상태인가
     - 확정됐거나
     - 아직 통화 전(접수·보류)이면 가능하다. 통화 전이 오히려 가장 깔끔한 취소 시점이다. */
  function canCancel(req, kind) {
    if (!req) return false;
    if (req.status === "cancel_requested" || req.status === "cancelled") return false;
    if (kind === "confirmed" || kind === "alt_confirmed" || kind === "hold") return true;
    return !kind;   // 결과가 아직 없는 상태 = 통화 전
  }

  /* 변경할 수 있는 상태인가 — 같은 식당의 일시·인원만 바꾼다 */
  function canChange(req, kind) {
    if (!req) return false;
    if (["cancel_requested", "cancelled", "change_requested"].indexOf(req.status) >= 0) return false;
    return kind === "confirmed" || kind === "alt_confirmed" || !kind;
  }

  /* 통화 전이면 언제 취소해도 전액 환불이다 */
  function beforeCall(kind) { return !kind || kind === "hold"; }

  /* 지금 취소하면 환불 대상인가
     - 통화 전: 항상 환불
     - 확정 후: 예약일 전일 23:59까지만 환불 (운영자 화면과 같은 기준) */
  function refundable(res) {
    var kind = res ? res.outcome : null;
    if (beforeCall(kind)) return true;
    if (!res || !res.confirmed_at) return true;
    var s = new Date(res.confirmed_at);
    var cutoff = new Date(s.getFullYear(), s.getMonth(), s.getDate(), 0, 0, 0);
    return new Date() < cutoff;
  }

  /* 변경 요청 화면 — 같은 식당의 일시·인원만 바꾼다 */
  function openChange(req, res) {
    var free = (req.change_count || 0) === 0 && refundable(res);
    var kst = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
    var minD = kst.getFullYear() + "-" +
      String(kst.getMonth() + 1).padStart(2, "0") + "-" +
      String(kst.getDate()).padStart(2, "0");

    $("root").innerHTML =
      "<div class='card'><h2>" + L("changeTitle") + "</h2>" +
      "<p class='sub' style='margin-top:0'>" + L("changeSame") + "</p>" +
      "<p class='sub' style='color:" + (free ? "var(--teal)" : "var(--coral)") + ";font-weight:600'>" +
        (free ? L("changeFree") : L("changePaid")) + "</p>" +

      "<div class='kv' style='margin-bottom:14px'><b>" + L("venue") + "</b><span>" +
        esc((req.venue_name_raw || "").split(" | ")[0]) + "</span></div>" +

      "<label class='fl'>" + L("changeDate") + "</label>" +
      "<div class='two'>" +
        "<input type='date' id='cgDate' min='" + minD + "'>" +
        "<input type='time' id='cgTime' step='600'>" +
      "</div>" +

      "<label class='fl'>" + L("changeParty") + "</label>" +
      "<input type='number' id='cgParty' min='1' max='7' value='" + (req.party_size || 2) + "'>" +

      "<label class='fl'>" + L("changeNote") + "</label>" +
      "<input type='text' id='cgNote' value='" + esc(req.note_to_venue || "") + "'>" +

      "<div class='btns' style='margin-top:16px'>" +
        "<button class='btn' id='cgSend' type='button'>" + L("changeSend") + "</button>" +
        "<button class='btn ghost' id='cgBack' type='button'>" + L("againBtn") + "</button>" +
      "</div></div>";
    window.scrollTo(0, 0);

    $("cgBack").addEventListener("click", function () { load(req.lookup_code); });

    $("cgSend").addEventListener("click", function () {
      var d = $("cgDate").value, tm = $("cgTime").value;
      var p = parseInt($("cgParty").value, 10);
      if (!d || !tm) { alert(L("changeDate")); return; }
      if (!p || p < 1 || p > 7) { alert(L("errChangeParty")); return; }
      var at = new Date(d + "T" + tm + ":00+09:00");
      if (at.getTime() < Date.now()) { alert(L("errChangePast")); return; }

      var btn = $("cgSend");
      btn.disabled = true;
      rpc("request_change", { p_code: req.lookup_code, p_at: at.toISOString(),
                              p_party: p, p_note: ($("cgNote").value || "").trim() || null })
        .then(function (out) {
          if (!out || !out.ok) throw new Error((out && out.msg) || "failed");
          try {
            fetch(cfg.url + "/functions/v1/notify", {
              method: "POST",
              headers: { "Content-Type": "application/json", "apikey": cfg.key },
              body: JSON.stringify({ kind: "change", code: req.lookup_code || "",
                venue: req.venue_name_raw || "", party: p, name: req.booking_name || "",
                lang: lang, refundable: !!out.free }),
              keepalive: true
            }).catch(function () {});
          } catch (e) {}
          alert(L("changeDone"));
          load(req.lookup_code);
        })
        .catch(function () { btn.disabled = false; alert(L("failed") || "failed"); });
    });
  }

  function render(req, res, venue) {
    var kind = res ? res.outcome : null;
    var hero, title, desc, tag;

    // 취소된 건은 결과와 무관하게 취소 상태로 보여준다
    var st = req && req.status;
    if (st === "change_requested") {
      hero = " hold";
      tag = L("tagChange"); title = L("titleChange"); desc = L("descChange");
      kind = "changing";
    } else if (st === "cancelled" || st === "cancel_requested") {
      var done = st === "cancelled";
      hero = " unavailable";
      tag = done ? L("tagCancelled") : L("tagCancelReq");
      title = done ? L("titleCancelled") : L("titleCancelReq");
      desc = done ? L("descCancelled") : L("descCancelReq");
      kind = "cancelled";   // 아래 블록들이 예약 상세·가이드를 그리지 않게 한다
    } else if (kind === "confirmed" || kind === "alt_confirmed") {
      hero = ""; tag = L("tagOk");
      title = fmtDT(res.confirmed_at);
      desc = (venue ? venue.name : req.venue_name_raw) + " · " + req.party_size + "명 · 예약자 " + (req.booking_name || "");
    } else if (kind === "hold") {
      hero = " hold"; tag = L("tagHold");
      title = L("titleHold");
      var ph = mapClean(res.pending_items, reasonText);
      desc = ph.length ? ph.join(" · ") : L("descHold");
    } else if (kind === "unavailable") {
      hero = " unavailable"; tag = L("tagNo");
      title = L("titleNo");
      desc = L("descNo");
    } else {
      hero = " hold"; tag = L("tagRun");
      title = L("titleRun");
      desc = L("descRun");
    }

    var html = "<div class='hero" + hero + "'><span class='tag'>" + tag + "</span>" +
      "<h1>" + esc(title) + "</h1><p>" + esc(desc) + "</p></div>";

    // 예약 상세
    if (kind === "confirmed" || kind === "alt_confirmed") {
      html += "<div class='card'><h2>" + L("detailTitle") + "</h2>" +
        "<div class='kv'><b>" + L("venue") + "</b><span>" + esc(venue ? venue.name : req.venue_name_raw) + "</span></div>" +
        (venue && venue.address ? "<div class='kv'><b>" + L("address") + "</b><span>" + esc(venue.address) + "</span></div>" : "") +
        (venue && venue.phone ? "<div class='kv'><b>" + L("phone") + "</b><span>" + esc(venue.phone) + "</span></div>" : "") +
        "<div class='kv'><b>" + L("when") + "</b><span>" + fmtDT(res.confirmed_at) + "</span></div>" +
        "<div class='kv'><b>" + L("party") + "</b><span>" + req.party_size + "</span></div>" +
        "<div class='kv'><b>" + L("bname") + "</b><span>" + esc(req.booking_name) + "</span></div>";
      if (kind === "alt_confirmed")
        html += "<div class='note'>" + L("altNote") + "</div>";
      html += "</div>";
    }

    // 식당 조건
    var conds = mapClean(res && res.venue_conditions, condText);
    if (conds.length) {
      html += "<div class='card'><h2>" + L("condTitle") + "</h2><p style='margin:0;font-size:15px'>" +
        esc(conds.join(" · ")) + "</p></div>";
    }

    // 미확정 항목
    var pend = (kind !== "hold") ? mapClean(res && res.pending_items, reasonText) : [];
    if (pend.length) {
      html += "<div class='card'><h2>" + L("pendTitle") + "</h2><p style='margin:0;font-size:15px'>" +
        esc(pend.join(" · ")) + "</p>" +
        "<div class='note'>" + L("pendNote") + "</div></div>";
    }

    // 가능 시간 (불가·보류일 때)
    if (res && res.alternatives && res.alternatives.length && kind !== "confirmed" && kind !== "alt_confirmed") {
      html += "<div class='card'><h2>" + L("availTitle") + "</h2><p style='margin:0;font-size:15px'>" +
        esc(res.alternatives.join(", ")) + "</p>" +
        "<div class='note'>" + L("availNote") + "</div></div>";
    }

    // 이용 가이드 + 한국어 카드 (확정일 때만)
    if (kind === "confirmed" || kind === "alt_confirmed") {
      var lines = guideFor(venue);
      var asOf = asOfText(venue);
      html += "<div class='guide'><h2>" + L("guideTitle") + "</h2>" +
        lines.map(function (t, i) {
          return "<div class='line'><b>" + (i + 1 < 10 ? "0" : "") + (i + 1) + "</b><span>" + esc(t) + "</span></div>";
        }).join("") +
        (asOf ? "<p class='asOf'>" + esc(asOf) + "</p>" : "") + "</div>";

      var koLine = fmtKoTime(res.confirmed_at) + "에 예약한 " +
        (req.booking_name || "") + "입니다. " + req.party_size + "명입니다." +
        (req.note_to_venue ? " " + req.note_to_venue : "");
      html += "<div class='card'><h2>" + L("showTitle") + "</h2>" +
        "<div class='ko'>" + esc(koLine) + "</div>" +
        "<p class='sub'>" + L("showSub") + "</p></div>";
    }

    // 조회 코드 (다시 찾아올 수 있도록 복사 버튼과 함께)
    if (req && req.lookup_code) {
      html += "<div class='card codeCard'><h2>" + L("yourCode") + "</h2>" +
        "<div class='codeRow'><span class='bigCode'>" + esc(req.lookup_code) + "</span>" +
        "<button type='button' class='rc-copy' id='copyMine' data-c='" + esc(req.lookup_code) + "' " +
        "aria-label='" + L("copyCode") + "'>" +
        "<svg viewBox='0 0 24 24' aria-hidden='true'><rect x='9' y='9' width='11' height='11' rx='2'/>" +
        "<path d='M5 15V5a2 2 0 0 1 2-2h10'/></svg><span>" + L("copyCode") + "</span></button></div>" +
        "<p class='sub' style='margin:10px 0 0'>" + L("codeKeep") + "</p></div>";
    }

    // 보류 — 고객이 조건을 받아들일지 결정한다
    if (kind === "hold" && !req.hold_reply) {
      html += "<div class='card holdCard'><h2>" + L("holdQ") + "</h2>" +
        "<div class='holdBtns'>" +
        "<button type='button' class='btn' id='holdYes'>" + L("holdYes") + "</button>" +
        "<button type='button' class='btn ghost' id='holdNo'>" + L("holdNo") + "</button>" +
        "</div></div>";
    } else if (kind === "hold" && req.hold_reply === "accept") {
      html += "<div class='card'><p style='margin:0;font-size:15px'>" + L("holdSent") + "</p></div>";
    }

    html += "<div class='btns'>" +
      (venue && venue.address ? "<a class='btn ghost' target='_blank' rel='noopener' href='https://map.naver.com/p/search/" +
        encodeURIComponent(venue.name + " " + venue.address) + "'>" + L("mapBtn") + "</a>" : "") +
      (canChange(req, kind)
        ? "<button class='btn ghost' id='changeBtn' type='button'>" + L("changeBtn") + "</button>"
        : "") +
      (canCancel(req, kind)
        ? "<button class='btn ghost' id='cancelBtn' type='button'>" + L("cancelBtn") + "</button>"
        : "") +
      "<a class='btn ghost' href='#' id='again'>" + L("againBtn") + "</a></div>";

    if (canCancel(req, kind)) {
      html += "<p class='sub' style='margin-top:12px'>" +
        (beforeCall(kind) ? L("cancelFree2")
         : refundable(res) ? L("cancelNote") : L("refundNone")) + "</p>";
    }

    $("root").innerHTML = html;

    var hy = $("holdYes"), hn = $("holdNo");
    function holdReply(accept, btn) {
      btn.disabled = true;
      if (hy) hy.disabled = true;
      if (hn) hn.disabled = true;
      rpc("request_hold_reply", { p_code: req.lookup_code, p_accept: accept })
        .then(function (out) {
          if (!out || !out.ok) throw new Error("failed");
          // 운영자에게 알린다 (실패해도 고객 흐름은 유지)
          try {
            fetch(cfg.url + "/functions/v1/notify", {
              method: "POST",
              headers: { "Content-Type": "application/json", "apikey": cfg.key },
              body: JSON.stringify({
                kind: accept ? "hold_accept" : "cancel",
                code: req.lookup_code || "", venue: req.venue_name_raw || "",
                party: req.party_size, name: req.booking_name || "",
                lang: lang, refundable: true, before_call: !accept
              }),
              keepalive: true
            }).catch(function () {});
          } catch (e) {}
          load(req.lookup_code);   // 새 상태로 다시 그린다
        })
        .catch(function () {
          btn.disabled = false;
          if (hy) hy.disabled = false;
          if (hn) hn.disabled = false;
        });
    }
    if (hy) hy.addEventListener("click", function () { holdReply(true, hy); });
    if (hn) hn.addEventListener("click", function () {
      if (!window.confirm(L("cancelAsk") + "\n\n" + L("cancelFree2"))) return;
      holdReply(false, hn);
    });

    var chg = $("changeBtn");
    if (chg) chg.addEventListener("click", function () { openChange(req, res); });

    var cm = $("copyMine");
    if (cm) cm.addEventListener("click", function () {
      var c = cm.getAttribute("data-c");
      var done = function () {
        var s = cm.querySelector("span");
        s.textContent = L("copied");
        cm.classList.add("ok");
        setTimeout(function () { s.textContent = L("copyCode"); cm.classList.remove("ok"); }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(c).then(done).catch(function () { fallbackCopy(c, done); });
      } else { fallbackCopy(c, done); }
    });
    var ag = $("again");
    if (ag) ag.addEventListener("click", function (e) { e.preventDefault(); location.hash = ""; location.reload(); });

    var cb = $("cancelBtn");
    if (cb) cb.addEventListener("click", function () {
      var pre = beforeCall(res ? res.outcome : null);
      var free = refundable(res);
      var note = pre ? L("cancelFree2") : (free ? L("cancelFree") : L("cancelPaid"));
      if (!window.confirm(L("cancelAsk") + "\n\n" + note)) return;
      cb.disabled = true;
      rpc("request_cancel", { p_code: req.lookup_code }).then(function (out) {
        if (!out || !out.ok) throw new Error("cancel failed");
        cb.textContent = pre ? L("cancelDone2") : L("cancelDone");
        // 운영자 알림 (실패해도 고객 흐름에 영향 없음)
        try {
          fetch(cfg.url + "/functions/v1/notify", {
            method: "POST",
            headers: { "Content-Type": "application/json", "apikey": cfg.key },
            body: JSON.stringify({
              kind: "cancel",
              code: req.lookup_code || "",
              venue: req.venue_name_raw || "",
              party: req.party_size,
              name: req.booking_name || "",
              lang: lang,
              refundable: pre ? true : free,
              before_call: pre
            }),
            keepalive: true
          }).catch(function () {});
        } catch (e) {}
      }).catch(function () {
        cb.disabled = false;
      });
    });
  }

  function load(rid) {
    if (!cfg.url) { $("root").innerHTML = "<div class='state'>" + L("noConn") + "</div>"; return; }
    $("root").innerHTML = "<div class='state'>" + L("loading") + "</div>";

    // 조회 코드로 정확히 한 건만 조회한다
    var code = rid.replace(/[^0-9a-zA-Z]/g, "").toUpperCase();
    // 코드를 정확히 아는 경우에만 그 한 건을 돌려주는 서버 함수를 쓴다
    rpc("get_request_by_code", { p_code: code })
      .then(function (req) {
        if (!req || !req.id) throw new Error(L("notFound"));
        return Promise.all([
          req,
          api("results?select=*&request_id=eq." + req.id).catch(function () { return []; }),
          req.venue_id ? api("venues?select=*&id=eq." + req.venue_id).catch(function () { return []; }) : []
        ]);
      })
      .then(function (a) {
        render(a[0], (a[1] && a[1][0]) || null, (a[2] && a[2][0]) || null);
      })
      .catch(function (e) {
        $("root").innerHTML = "<div class='state'>" + esc(e.message) + "</div>";
        drawLookup(true);
      });
  }

  /* 언어 버튼 */
  $("langs").innerHTML = ORDER.map(function (l) {
    return "<button type='button' data-l='" + l + "'>" + T[l].label + "</button>";
  }).join("");

  var langBox = $("langs"), langBtn = $("langBtn"), langNow = $("langNow");
  function closeLang() { langBox.classList.remove("open"); langBtn.setAttribute("aria-expanded", "false"); }
  langBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = langBox.classList.toggle("open");
    langBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", function (e) {
    if (!langBox.contains(e.target) && e.target !== langBtn) closeLang();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLang(); });
  function applyLang() {
    document.documentElement.lang = lang === "zh-TW" ? "zh-Hant" : lang === "zh-CN" ? "zh-Hans" : lang;
    Array.prototype.forEach.call($("langs").querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-l") === lang ? "true" : "false");
    });
    if (langNow) langNow.textContent = T[lang].label;
    try { localStorage.setItem("cb-lang", lang); } catch (e) {}
    var cur = (location.hash || "").replace("#", "").trim();
    if (cur) { load(cur); } else { drawLookup(); }
  }
  /* 이 기기에서 보낸 요청 목록 (접수 시 브라우저에 남겨둔 코드) */
  /* 클립보드를 쓸 수 없는 환경(구형 브라우저·보안 제한)용 */
  function fallbackCopy(text, done) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) {}
  }

  function recentList() {
    try { return JSON.parse(localStorage.getItem("cb-codes") || "[]"); }
    catch (e) { return []; }
  }

  function recentHtml() {
    var list = recentList();
    var body = list.length
      ? list.map(function (x) {
          var d = "";
          try {
            d = new Intl.DateTimeFormat(
              { ja: "ja-JP", "zh-TW": "zh-TW", "zh-CN": "zh-CN", en: "en-US", ko: "ko-KR" }[lang] || "ja-JP",
              { month: "short", day: "numeric" }).format(new Date(x.at));
          } catch (e) {}
          var c = esc(x.code);
          return "<div class='recent'>" +
            "<button type='button' class='rc-open' data-c='" + c + "'>" +
              "<span class='rc-top'><b>" + esc(x.name || x.code) + "</b><span>" + d + "</span></span>" +
              "<span class='rc-code'>" + c + "</span>" +
            "</button>" +
            "<button type='button' class='rc-copy' data-c='" + c + "' aria-label='" + L("copyCode") + "'>" +
              "<svg viewBox='0 0 24 24' aria-hidden='true'>" +
              "<rect x='9' y='9' width='11' height='11' rx='2'/>" +
              "<path d='M5 15V5a2 2 0 0 1 2-2h10'/></svg>" +
              "<span>" + L("copyCode") + "</span>" +
            "</button>" +
          "</div>";
        }).join("")
      : "<p class='sub' style='margin:0'>" + L("recentNone") + "</p>";

    return "<div class='card'><h2>" + L("recentTitle") + "</h2>" +
      "<p class='sub' style='margin-top:0'>" + L("recentHint") + "</p>" +
      "<div class='recents'>" + body + "</div>" +
      "<p class='sub' style='margin:12px 0 0'>" + L("signInFind") + "</p></div>";
  }

  function drawLookup(append) {
    var head = append ? $("root").innerHTML : "<div class='state'>" + L("idle") + "</div>";
    $("root").innerHTML = head +
      "<div class='card'><h2>" + L("lookupTitle") + "</h2>" +
      "<p class='sub' style='margin-top:0'>" + L("lookupHint") + "</p>" +
      "<div class='lookup'><input id='rid' placeholder='" + L("lookupPh") + "'>" +
      "<button class='btn' id='go'>" + L("go") + "</button></div></div>" +
      recentHtml();
    $("go").addEventListener("click", function () {
      var v = ($("rid").value || "").trim(); if (v) { location.hash = v; load(v); }
    });
    $("rid").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { var v = ($("rid").value || "").trim(); if (v) { location.hash = v; load(v); } }
    });
    Array.prototype.forEach.call(document.querySelectorAll(".rc-open"), function (b) {
      b.addEventListener("click", function () {
        var c = b.getAttribute("data-c");
        location.hash = c; load(c);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".rc-copy"), function (b) {
      b.addEventListener("click", function () {
        var c = b.getAttribute("data-c");
        var done = function () {
          var s = b.querySelector("span");
          s.textContent = L("copied");
          b.classList.add("ok");
          setTimeout(function () { s.textContent = L("copyCode"); b.classList.remove("ok"); }, 1800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(c).then(done).catch(function () { fallbackCopy(c, done); });
        } else { fallbackCopy(c, done); }
      });
    });
  }
  Array.prototype.forEach.call($("langs").querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-l"); applyLang(); closeLang(); });
  });

  var h = (location.hash || "").replace("#", "").trim();
  applyLang();
  if (h) load(h);
})();
</script>
</body>
</html>
