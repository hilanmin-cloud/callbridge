  .kv { display: flex; gap: 10px; padding: 7px 0; font-size: 15px; border-bottom: 1px dashed var(--line); }
  .kv:last-child { border-bottom: 0; }
  .kv b { flex: 0 0 92px; color: var(--muted); font-weight: 500; font-size: 14px; }
  .note { background: var(--warm); color: var(--warmink); border-radius: 10px; padding: 12px 14px;

  .guide { background: var(--soft); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .guide h2 { margin: 0 0 12px; font-size: 16px; }
  .guide .line { display: flex; gap: 11px; font-size: 15px; padding: 6px 0; }
  .guide .line b { flex: 0 0 auto; color: var(--teal); font-weight: 700; }
  .ko { font-size: 18px; line-height: 1.7; padding: 14px; background: var(--soft); border-radius: 10px; margin-top: 6px; }
  .sub { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  a.btn, button.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px;
    padding: 0 18px; border-radius: 10px; text-decoration: none; font-size: 16px; font-weight: 600;
    font-family: inherit; cursor: pointer; border: 1px solid var(--teal); background: var(--teal); color: #fff; }

  .state { padding: 40px 0; text-align: center; color: var(--muted); font-size: 15px; }
  .langs { display: flex; gap: 5px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 12px; min-height: 34px; padding: 0 10px; border-radius: 17px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .langs button.on { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }
  .lookup { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .lookup input { flex: 1 1 200px; min-width: 0; min-height: 48px; padding: 8px 12px; font: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  .lookup button { flex: 0 1 110px; min-height: 48px; }
  footer { text-align: center; font-size: 13px; color: var(--muted); padding: 24px 0 0; }

        (venue && venue.address ? "<div class='kv'><b>" + L("address") + "</b><span>" + esc(venue.address) + "</span></div>" : "") +
        (venue && venue.phone ? "<div class='kv'><b>" + L("phone") + "</b><span>" + esc(venue.phone) + "</span></div>" : "") +
        "<div class='kv'><b>" + L("when") + "</b><span>" + fmtDT(res.confirmed_at) + "</span></div>" +
        "<div class='kv'><b>" + L("party") + "</b><span>" + req.party_size + "</span></div>" +
        "<div class='kv'><b>" + L("bname") + "</b><span>" + esc(req.booking_name) + "</span></div>";
      if (kind === "alt_confirmed")
        html += "<div class='note'>" + L("altNote") + "</div>";
      html += "</div>";
    }

    // 식당 조건
    var conds = res && res.venue_conditions;
    if (conds && conds.length) {
      html += "<div class='card'><h2>" + L("condTitle") + "</h2><p style='margin:0;font-size:15px'>" +
        esc(conds.join(" · ")) + "</p></div>";
    }

    // 미확정 항목
    if (res && res.pending_items && res.pending_items.length && kind !== "hold") {
      html += "<div class='card'><h2>" + L("pendTitle") + "</h2><p style='margin:0;font-size:15px'>" +
        esc(res.pending_items.join(" · ")) + "</p>" +
        "<div class='note'>" + L("pendNote") + "</div></div>";
    }

    // 가능 시간 (불가·보류일 때)
    if (res && res.alternatives && res.alternatives.length && kind !== "confirmed" && kind !== "alt_confirmed") {
      html += "<div class='card'><h2>" + L("availTitle") + "</h2><p style='margin:0;font-size:15px'>" +
        esc(res.alternatives.join(", ")) + "</p>" +
        "<div class='note'>" + L("availNote") + "</div></div>";
    }

    // 이용 가이드 + 한국어 카드 (확정일 때만)
    if (kind === "confirmed" || kind === "alt_confirmed") {
      var lines = guideFor(venue ? venue.category : "");
      html += "<div class='guide'><h2>" + L("guideTitle") + "</h2>" +
        lines.map(function (t, i) {
          return "<div class='line'><b>" + (i + 1 < 10 ? "0" : "") + (i + 1) + "</b><span>" + esc(t) + "</span></div>";
        }).join("") + "</div>";

      var koLine = fmtKoTime(res.confirmed_at) + "에 예약한 " +
        (req.booking_name || "") + "입니다. " + req.party_size + "명입니다." +
        (req.note_to_venue ? " " + req.note_to_venue : "");
      html += "<div class='card'><h2>" + L("showTitle") + "</h2>" +
        "<div class='ko'>" + esc(koLine) + "</div>" +
        "<p class='sub'>" + L("showSub") + "</p></div>";
    }

    html += "<div class='btns'>" +
      (venue && venue.address ? "<a class='btn ghost' target='_blank' rel='noopener' href='https://map.naver.com/p/search/" +
        encodeURIComponent(venue.name + " " + venue.address) + "'>" + L("mapBtn") + "</a>" : "") +
      "<a class='btn ghost' href='#' id='again'>" + L("againBtn") + "</a></div>";

    $("root").innerHTML = html;
    var ag = $("again");
    if (ag) ag.addEventListener("click", function (e) { e.preventDefault(); location.hash = ""; location.reload(); });
  }

  function load(rid) {
    if (!cfg.url) { $("root").innerHTML = "<div class='state'>" + L("noConn") + "</div>"; return; }
    $("root").innerHTML = "<div class='state'>" + L("loading") + "</div>";

    // 조회 코드로 정확히 한 건만 조회한다
    var code = rid.replace(/[^0-9a-zA-Z]/g, "").toUpperCase();
    api("requests?select=*&lookup_code=eq." + encodeURIComponent(code) + "&limit=1")
      .then(function (rs) {
        if (!rs || !rs.length) throw new Error(L("notFound"));
        var req = rs[0];
        return Promise.all([
          req,
          api("results?select=*&request_id=eq." + req.id).catch(function () { return []; }),
          req.venue_id ? api("venues?select=*&id=eq." + req.venue_id).catch(function () { return []; }) : []
        ]);
      })
      .then(function (a) {
        render(a[0], (a[1] && a[1][0]) || null, (a[2] && a[2][0]) || null);
      })
      .catch(function (e) {
        $("root").innerHTML = "<div class='state'>" + esc(e.message) + "</div>";
        drawLookup(true);
      });
  }

  /* 언어 버튼 */
  $("langs").innerHTML = ORDER.map(function (l) {
    return "<button data-l='" + l + "'>" + T[l].label + "</button>";
  }).join("");
  function applyLang() {
    document.documentElement.lang = lang === "zh-TW" ? "zh-Hant" : lang === "zh-CN" ? "zh-Hans" : lang;
    Array.prototype.forEach.call($("langs").querySelectorAll("button"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-l") === lang);
    });
    try { localStorage.setItem("cb-lang", lang); } catch (e) {}
    var cur = (location.hash || "").replace("#", "").trim();
    if (cur) { load(cur); } else { drawLookup(); }
  }
  function drawLookup(append) {
    var head = append ? $("root").innerHTML : "<div class='state'>" + L("idle") + "</div>";
    $("root").innerHTML = head +
      "<div class='card'><h2>" + L("lookupTitle") + "</h2>" +
      "<p class='sub' style='margin-top:0'>" + L("lookupHint") + "</p>" +
      "<div class='lookup'><input id='rid' placeholder='" + L("lookupPh") + "'>" +
      "<button class='btn' id='go'>" + L("go") + "</button></div></div>";
    $("go").addEventListener("click", function () {
      var v = ($("rid").value || "").trim(); if (v) { location.hash = v; load(v); }
    });
    $("rid").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { var v = ($("rid").value || "").trim(); if (v) { location.hash = v; load(v); } }
    });
  }
  Array.prototype.forEach.call($("langs").querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-l"); applyLang(); });
  });

  var h = (location.hash || "").replace("#", "").trim();
  applyLang();
  if (h) load(h);
})();
</script>
</body>
</html>
