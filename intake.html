<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CallBridge</title>
<style>
  :root {
    color-scheme: light;
    --teal: #0F5E5C; --gold: #C08A2E; --ink: #15211F; --muted: #5A6A67;
    --line: #DCE6E5; --soft: #F4F8F7; --bg: #FFFFFF; --warm: #FBF4E6; --warmink: #4A3A10;
    --ok: #0F5E5C; --err: #8A3B3B;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --teal: #4E8F8C; --gold: #D9A450; --ink: #E8EFEE; --muted: #9FB0AD;
      --line: #2A3836; --soft: #16211F; --bg: #0E1716; --warm: #26210F; --warmink: #E2CF9E;
      --ok: #4E8F8C; --err: #D98A8A;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --teal: #4E8F8C; --gold: #D9A450; --ink: #E8EFEE; --muted: #9FB0AD;
    --line: #2A3836; --soft: #16211F; --bg: #0E1716; --warm: #26210F; --warmink: #E2CF9E;
    --ok: #4E8F8C; --err: #D98A8A;
  }
  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Noto Sans JP", "Noto Sans SC", "Noto Sans TC", "Noto Sans KR", system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .brand { font-size: 18px; font-weight: 700; color: var(--teal); }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; min-height: 36px; padding: 0 12px; border-radius: 18px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .langs button.on { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }
  .wrap { display: flex; flex-wrap: wrap; gap: 18px; padding: 18px 20px 48px; max-width: 1020px; }
  @media (max-width: 420px) { .wrap { padding: 14px 12px 40px; gap: 14px; }
    .card { padding: 13px; } header { padding: 14px 12px; } }
  .col { flex: 1 1 330px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; color: var(--teal); }
  .card .hint { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; max-width: 100%; min-width: 0; min-height: 44px; padding: 8px 11px;
    font: inherit; font-size: 15px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--ink); }
  input[type=date], input[type=time] { -webkit-appearance: none; appearance: none; }
  textarea { min-height: 64px; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .row > * { flex: 1 1 120px; min-width: 0; }
  .rank { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .rank .no { flex: 0 0 auto; min-width: 52px; font-size: 13px; font-weight: 600; color: var(--teal);
    background: var(--soft); border-radius: 7px; padding: 10px 8px; text-align: center; }
  .rank .f { flex: 1 1 180px; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .rank .f input { flex: 1 1 110px; min-width: 0; }
  /* 좁은 화면(폴더블 접은 상태 등)에서는 날짜·시간을 세로로 */
  @media (max-width: 420px) {
    .rank { flex-direction: column; align-items: stretch; }
    .rank .no { align-self: flex-start; padding: 6px 12px; }
    .rank .f { flex-direction: column; }
    .rank .f input { flex: 1 1 auto; width: 100%; }
  }
  .chk { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; margin: 10px 0;
    cursor: pointer; }
  .chk input { width: 19px; min-height: 19px; height: 19px; flex: 0 0 auto; margin-top: 3px; cursor: pointer; }
  .chk label { margin: 0; color: var(--ink); font-size: 14px; cursor: pointer;
    -webkit-user-select: none; user-select: none; }
  button.go { font: inherit; font-size: 16px; font-weight: 600; min-height: 52px; width: 100%;
    border-radius: 10px; border: 1px solid var(--teal); background: var(--teal); color: #fff; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: default; }
  button.ghost { font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--teal); background: transparent; color: var(--teal); cursor: pointer; }
  .note { background: var(--warm); color: var(--warmink); border-radius: 10px; padding: 12px 14px;
    font-size: 13.5px; line-height: 1.6; margin-top: 10px; }
  .status { border-radius: 10px; padding: 13px 15px; font-size: 14px; }
  .status.ok { background: var(--ok); color: #fff; }
  .status.err { background: var(--err); color: #fff; }
  .status.info { background: var(--soft); color: var(--muted); }
  pre { background: var(--soft); border-radius: 9px; padding: 11px; font-size: 12.5px; white-space: pre-wrap;
    margin: 0; font-family: Consolas, monospace; color: var(--ink); max-height: 280px; overflow: auto; }
  details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; }
  summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--teal); }
  .conn { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  .price { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; padding: 5px 0; }
  .price.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; font-weight: 600; font-size: 16px; }
  footer { padding: 0 20px 34px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header>
  <span class="brand">CallBridge</span>
  <div class="langs" id="langs"></div>
</header>

<div class="wrap">
  <div class="col">
    <div class="card">
      <h2 data-t="formTitle"></h2>
      <p class="hint" data-t="formLead"></p>

      <label for="vlink" data-t="linkLabel"></label>
      <input id="vlink" type="url">
      <p class="hint" style="margin:6px 0 0" data-t="linkHint"></p>
      <p class="hint" style="margin:4px 0 0" data-t="linkHow"></p>

      <label for="venue" data-t="venueLabel" style="margin-top:12px"></label>
      <input id="venue">
      <p class="hint" style="margin:6px 0 0" data-t="venueHint"></p>

      <div class="row" style="margin-top:12px">
        <div>
          <label for="party" data-t="partyLabel"></label>
          <input id="party" type="number" value="2" min="1">
        </div>
        <div style="flex:2 1 170px">
          <label for="bname" data-t="nameLabel"></label>
          <input id="bname" placeholder="Emma L.">
        </div>
      </div>

      <label data-t="slotsLabel" style="margin-top:14px"></label>
      <p class="hint" style="margin:0 0 4px" data-t="slotsHint"></p>
      <div class="rank"><span class="no" data-t="r1"></span><span class="f"><input type="date" id="d1"><input type="time" id="t1" value="19:00"></span></div>
      <div class="rank"><span class="no" data-t="r2"></span><span class="f"><input type="date" id="d2"><input type="time" id="t2" value="13:00"></span></div>
      <div class="rank"><span class="no" data-t="r3"></span><span class="f"><input type="date" id="d3"><input type="time" id="t3" value="19:30"></span></div>

      <div class="chk"><input type="checkbox" id="tol" checked><label for="tol" data-t="cTol"></label></div>
      <div class="chk"><input type="checkbox" id="split" checked><label for="split" data-t="cSplit"></label></div>
      <div class="chk"><input type="checkbox" id="seat"><label for="seat" data-t="cSeat"></label></div>
      <div class="chk"><input type="checkbox" id="course"><label for="course" data-t="cCourse"></label></div>
      <div class="chk"><input type="checkbox" id="late" checked><label for="late" data-t="cLate"></label></div>

      <label for="note" data-t="noteLabel" style="margin-top:12px"></label>
      <textarea id="note"></textarea>
      <p class="hint" style="margin:6px 0 0" data-t="noteHint"></p>

      <label for="email" data-t="emailLabel" style="margin-top:12px"></label>
      <input id="email" type="email" placeholder="you@example.com">
    </div>
  </div>

  <div class="col">
    <div class="card">
      <h2 data-t="priceTitle"></h2>
      <div class="price"><span data-t="priceItem"></span><strong>₩9,900</strong></div>
      <div class="price"><span data-t="priceChange"></span><span data-t="included"></span></div>
      <div class="price"><span data-t="priceCallback"></span><span data-t="included"></span></div>
      <div class="price total"><span data-t="priceTotal"></span><strong>₩9,900</strong></div>
      <div class="note" data-t="refundNote"></div>
      <div class="chk" style="margin-top:12px"><input type="checkbox" id="agree"><label for="agree" data-t="aiConsent"></label></div>
      <button class="go" id="submit" style="margin-top:10px" data-t="submitBtn"></button>
      <p class="conn" id="conn"></p>
    </div>

    <div id="status" class="status info" data-t="statusIdle"></div>

    <div class="card">
      <h2 data-t="previewTitle"></h2>
      <p class="hint" data-t="previewHint"></p>
      <pre id="preview"></pre>
    </div>

    <details>
      <summary data-t="setupTitle"></summary>
      <p class="hint" style="margin-top:8px" data-t="setupHint"></p>
      <label for="url">Project URL</label>
      <input id="url" placeholder="https://xxxxx.supabase.co">
      <label for="key">Publishable key</label>
      <input id="key" placeholder="sb_publishable_...">
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="save" data-t="saveBtn"></button>
        <button class="ghost" id="forget" data-t="forgetBtn"></button>
      </div>
    </details>
  </div>
</div>

<footer data-t="footer"></footer>

      errAgree: "Please agree to the AI call.",
      saving: "Sending…", saved: "Sent. Request number ",
      failed: "Could not send: ", offline: "Not connected, so nothing was saved. Data structure only.",
      footer: "We never collect passport numbers or card details."
    },
    ko: {
      label: "한국어",

      linkHow: "네이버 지도나 구글 지도에서 식당을 열고 공유를 눌러 링크를 복사해 붙여넣으세요.",
      venueLabel: "식당 이름 (링크가 없을 때)",

      venueHint: "네이버나 구글 지도 링크를 주시면 가장 정확합니다.",
      partyLabel: "인원", nameLabel: "예약자명",
      slotsLabel: "희망 일시 (1~3순위)",
      slotsHint: "1순위가 만석이면 2·3순위 범위 안에서 통화 중에 바로 확정합니다.",
      r1: "1순위", r2: "2순위", r3: "3순위",
      cTol: "적어둔 시각에서 ±30분이면 당겨도 미뤄도 괜찮습니다",

      cCourse: "코스·세트 메뉴여도 괜찮습니다",
      cLate: "10분 정도 늦을 수 있다고 전해주세요",
      noteLabel: "식당에 전할 내용",
      notePh: "알레르기, 아이 동반, 좌석 요청 등",
      noteHint: "모국어로 적으시면 한국어로 옮겨 전달합니다.",
      emailLabel: "결과 받을 이메일",
      priceTitle: "요금", priceItem: "식당 예약", priceChange: "변경·취소 1회",
      priceCallback: "식당 회신 전화 대응", included: "포함", priceTotal: "합계",
      refundNote: "요금은 통화 시도가 아니라 결과에 대한 것입니다. 적어주신 일시가 모두 안 되면 전액 환불하고, 식당에 가능한 시간은 그대로 알려드립니다.",
      aiConsent: "식당에 AI 상담원이 신분을 밝히고 전화하는 것에 동의합니다.",
      submitBtn: "요청 보내기",
      statusIdle: "요청을 보내면 결과가 여기에 표시됩니다.",
      previewTitle: "저장될 데이터", previewHint: "입력이 어떻게 저장되는지 보여줍니다.",
      setupTitle: "연결 설정 (운영용)", setupHint: "이 브라우저에만 저장됩니다.",
      saveBtn: "저장하고 연결", forgetBtn: "연결 해제",
      connOff: "연결 전 — 미리보기만 동작", connOn: "연결됨 — 요청이 저장됩니다",
      errVenue: "식당 이름을 입력해 주세요.", errSlot: "희망 일시를 최소 1개 입력해 주세요.",
      errAgree: "AI 통화 동의가 필요합니다.",
      saving: "저장 중…", saved: "저장 완료. 요청 번호 ",
      failed: "저장 실패: ", offline: "연결 전입니다. 저장되지 않았고 데이터 구조만 만들었습니다.",
      footer: "여권번호나 카드 정보는 수집하지 않습니다."
    }
  };

  var ORDER = ["ja", "zh-TW", "zh-CN", "en", "ko"];
  var lang = "ja";
  try { var sv = localStorage.getItem("cb-lang"); if (sv && T[sv]) lang = sv; } catch (e) {}
  function t(k) { return (T[lang] && T[lang][k]) || T.ja[k] || k; }

  $("langs").innerHTML = ORDER.map(function (l) {
    return "<button data-l='" + l + "'>" + T[l].label + "</button>";
  }).join("");

  function applyLang() {
    document.documentElement.lang = lang === "zh-TW" ? "zh-Hant" : lang === "zh-CN" ? "zh-Hans" : lang;
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (el) {
      el.textContent = t(el.getAttribute("data-t"));
    });
    $("venue").placeholder = t("venuePh");
    $("vlink").placeholder = t("linkPh");
    $("note").placeholder = t("notePh");
    Array.prototype.forEach.call($("langs").querySelectorAll("button"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-l") === lang);
    });
    drawConn(); preview();
    try { localStorage.setItem("cb-lang", lang); } catch (e) {}
  }

  Array.prototype.forEach.call($("langs").querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-l"); applyLang(); });
  });

  function iso(d) { return d.toISOString().slice(0, 10); }
  var now = new Date();
  $("d1").value = iso(new Date(now.getTime() + 86400000));
  $("d2").value = iso(new Date(now.getTime() + 86400000));
  $("d3").value = iso(new Date(now.getTime() + 2 * 86400000));

  var CFG = "sb-cfg-v1";
  var cfg = { url: "", key: "" };
  try { var s = localStorage.getItem(CFG); if (s) cfg = JSON.parse(s); } catch (e) {}
  function connected() { return !!(cfg.url && cfg.key); }
  function drawConn() {
    $("conn").innerHTML = connected()
      ? "<span class='dot on'></span>" + t("connOn")
      : "<span class='dot'></span>" + t("connOff");
    if (connected()) { $("url").value = cfg.url; $("key").value = cfg.key; }
  }

  function api(path, options) {
    options = options || {};
    return fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/" + path, {
      method: options.method || "GET",
      headers: { "apikey": cfg.key, "Authorization": "Bearer " + cfg.key,
                 "Content-Type": "application/json", "Prefer": options.prefer || "return=representation" },
      body: options.body ? JSON.stringify(options.body) : undefined
    }).then(function (res) {
      return res.text().then(function (txt) {
        var d = null; try { d = txt ? JSON.parse(txt) : null; } catch (e) { d = txt; }
        if (!res.ok) throw new Error((d && d.message) ? d.message : "HTTP " + res.status);
        return d;
      });
    });
  }

  function collect() {
    var slots = [];
    [["d1","t1"],["d2","t2"],["d3","t3"]].forEach(function (p, i) {
      var d = $(p[0]).value, tm = $(p[1]).value;
      if (d && tm) slots.push({ rank: i + 1, slot_at: d + "T" + tm + ":00+09:00",
                                tolerance_min: $("tol").checked ? 30 : 0 });
    });
    var link = $("vlink").value.trim();
    var nm = $("venue").value.trim();
    return {
      customer: { display_name: $("bname").value.trim(), email: $("email").value.trim(), locale: lang },
      venue: { name: nm, link: link },
      request: {
        venue_name_raw: (nm || "") + (link ? " | " + link : ""), service_type: "booking",
        party_size: parseInt($("party").value, 10) || 1,
        booking_name: $("bname").value.trim(),
        note_to_venue: $("note").value.trim() || null, status: "received"
      },
      slots: slots,
      conditions: { split_seating: $("split").checked, course_only: $("course").checked,
                    seat_type_any: $("seat").checked, late_arrival: $("late").checked }
    };
  }
  function preview() { $("preview").textContent = JSON.stringify(collect(), null, 2); }
  function setStatus(k, m) { var el = $("status"); el.className = "status " + k; el.removeAttribute("data-t"); el.textContent = m; }

  function submit() {
    var d = collect();
    if (!d.venue.name && !d.venue.link) { setStatus("err", t("errVenue")); return; }
    if (!d.slots.length) { setStatus("err", t("errSlot")); return; }
    if (!$("agree").checked) { setStatus("err", t("errAgree")); return; }
    if (!connected()) { setStatus("info", t("offline")); preview(); return; }

    $("submit").disabled = true;
    setStatus("info", t("saving"));
    var ids = {};
    api("customers", { method: "POST", body: d.customer })
      .then(function (r) {
        ids.customer = r[0].id;
        if (!d.venue.name) return [];
        var q = d.venue.name.replace(/\(.*?\)/g, "").trim().slice(0, 12);
        return api("venues?select=id&name=ilike.*" + encodeURIComponent(q) + "*&limit=1").catch(function () { return []; });
      })
      .then(function (found) {
        d.request.customer_id = ids.customer;
        if (found && found.length) d.request.venue_id = found[0].id;
        return api("requests", { method: "POST", body: d.request });
      })
      .then(function (r) {
        ids.request = r[0].id;
        return api("request_slots", { method: "POST", body: d.slots.map(function (s) { s.request_id = ids.request; return s; }) });
      })
      .then(function () {
        d.conditions.request_id = ids.request;
        return api("request_conditions", { method: "POST", body: d.conditions });
      })
      .then(function () { setStatus("ok", t("saved") + ids.request.slice(0, 8)); })
      .catch(function (e) { setStatus("err", t("failed") + e.message); })
      .then(function () { $("submit").disabled = false; });
  }

  $("submit").addEventListener("click", submit);
  $("save").addEventListener("click", function () {
    cfg = { url: $("url").value.trim(), key: $("key").value.trim() };
    try { localStorage.setItem(CFG, JSON.stringify(cfg)); } catch (e) {}
    drawConn();
  });
  $("forget").addEventListener("click", function () {
    cfg = { url: "", key: "" };
    try { localStorage.removeItem(CFG); } catch (e) {}
    $("url").value = ""; $("key").value = ""; drawConn();
  });
  Array.prototype.forEach.call(document.querySelectorAll("input, textarea"), function (el) {
    if (el.id === "url" || el.id === "key") return;
    el.addEventListener("input", preview); el.addEventListener("change", preview);
  });

  applyLang();
})();
</script>
