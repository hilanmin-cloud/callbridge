<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リクエストを送る｜CallBridge 韓国レストラン予約代行</title>
<meta name="description" content="行きたいお店と希望日時を入力するだけ。韓国語で代わりに電話し、席を確保します。予約が取れなければ料金はいただきません。">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0F5E5C">
<link rel="canonical" href="https://callbridge-kr.vercel.app/intake.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CallBridge">
<meta property="og:title" content="リクエストを送る｜CallBridge">
<meta property="og:description" content="韓国語で代わりに電話して、レストランの席を確保します。">
<meta property="og:url" content="https://callbridge-kr.vercel.app/intake.html">
<style>
  :root {
    color-scheme: light only;
    --teal: #0F5E5C; --teal-d: #0A4443; --teal-l: #2E7D7A;
    --coral: #F0603F; --coral-d: #D4482A;
    --gold: #C9962F;
    --ink: #1A2422; --muted: #6B7A77; --line: #E6E2DD;
    --soft: #FFF1EB; --mist: #F3F7F6; --bg: #FFFBF8; --card: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Noto Sans JP", system-ui, sans-serif; font-size: 16px; line-height: 1.65; }
  .wrap { max-width: 1060px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }

  /* ===== 상단 ===== */
  .bar { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 20; }
  .bar .in { min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; }
  .logo { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 800;
    color: var(--teal); text-decoration: none; }
  .logo .dot { width: 9px; height: 9px; border-radius: 5px; background: var(--coral); }
  .langwrap { position: relative; }
  .langbtn { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13.5px;
    min-height: 38px; padding: 0 13px; border-radius: 19px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
    transition: border-color .18s, background .18s; }
  .langbtn:hover { border-color: var(--teal); }
  .langbtn svg { width: 16px; height: 16px; fill: none; stroke: var(--teal); stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .langbtn .caret { width: 13px; height: 13px; stroke: var(--muted); stroke-width: 2.4;
    transition: transform .2s; }
  .langbtn[aria-expanded="true"] .caret { transform: rotate(180deg); }
  .langbtn[aria-expanded="true"] { border-color: var(--teal); background: var(--mist); }

  .langs { display: none; position: absolute; right: 0; top: calc(100% + 7px); z-index: 30;
    flex-direction: column; gap: 2px; min-width: 150px; padding: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 26px rgba(15,94,92,.14); }
  .langs.open { display: flex; animation: dropIn .18s ease both; }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
  .langs button { font: inherit; font-size: 14px; min-height: 42px; padding: 0 13px; border-radius: 8px;
    border: 0; background: transparent; color: var(--ink); cursor: pointer; text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    transition: background .14s; }
  .langs button:hover { background: var(--mist); }
  .langs button[aria-pressed="true"] { background: var(--mist); color: var(--teal); font-weight: 700; }
  .langs button[aria-pressed="true"]::after { content: ""; width: 5px; height: 9px;
    border: solid var(--teal); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }



  /* ===== 진행 표시 ===== */
  .prog { border-bottom: 1px solid var(--line); background: var(--card); }
  .prog .in { padding: 18px 0; display: flex; align-items: center; }
  .pstep { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
  .pstep .n { width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700; background: var(--line); color: var(--muted); }
  .pstep .t { font-size: 13.5px; color: var(--muted); font-weight: 600; }
  .pstep.on .n { background: var(--teal); color: #fff; }
  .pstep.on .t { color: var(--ink); }
  .pline { flex: 1 1 auto; height: 2px; background: var(--line); margin: 0 14px; }
  .pline.on { background: var(--teal); }

  /* ===== 본문 ===== */
  .main { padding: 44px 0 80px; display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start; }
  .form { flex: 2 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 34px; }

  .title h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -.02em; }
  .title p { margin: 0; font-size: 15px; color: var(--muted); }

  section.blk { display: flex; flex-direction: column; gap: 16px; }
  section.blk + section.blk { padding-top: 30px; border-top: 1px solid var(--line); }
  .blkhead { display: flex; align-items: center; gap: 11px; }
  .blkhead .n { width: 24px; height: 24px; border-radius: 12px; background: var(--teal); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: 0 0 auto; }
  .blkhead h2 { margin: 0; font-size: 18px; font-weight: 700; }

  label { display: block; font-size: 13.5px; font-weight: 600; color: var(--muted); margin-bottom: 7px; }
  .fld { position: relative; }
  input[type=text], input[type=url], input[type=email], input[type=date], input[type=time], textarea {
    width: 100%; min-height: 54px; padding: 0 16px; font: inherit; font-size: 16px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--card); color: var(--ink);
    transition: border-color .18s, box-shadow .18s; }
  textarea { min-height: 88px; padding: 14px 16px; resize: vertical; line-height: 1.6; }
  input:focus, textarea:focus { outline: 0; border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(15,94,92,.12); }
  input::placeholder, textarea::placeholder { color: #B5BFBD; }
  .hint { margin: 7px 0 0; font-size: 13px; color: var(--muted); }

  .or { display: flex; align-items: center; gap: 14px; margin: 4px 0; }
  .or span { font-size: 12.5px; color: var(--muted); }
  .or i { flex: 1 1 auto; height: 1px; background: var(--line); }

  /* 순위 줄 */
  .slot { display: flex; align-items: center; gap: 11px; }
  .slot .rk { flex: 0 0 56px; min-height: 54px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 700;
    background: var(--card); color: var(--muted); border: 1px solid var(--line); }
  .slot.filled .rk { background: var(--teal); color: #fff; border-color: var(--teal); }
  .slot .pair { flex: 1 1 auto; display: flex; gap: 8px; min-width: 0; }
  .slot .pair input { flex: 1 1 120px; min-width: 0; }

  /* 인원 */
  .count { display: inline-flex; align-items: stretch; border: 1px solid var(--line);
    border-radius: 11px; overflow: hidden; background: var(--card); }
  .count button { width: 52px; min-height: 54px; border: 0; background: transparent; cursor: pointer;
    font-size: 21px; color: var(--teal); font-family: inherit; transition: background .15s; }
  .count button:hover { background: var(--mist); }
  .count .v { min-width: 62px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }

  /* 칩 */
  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip { min-height: 46px; padding: 0 18px; border-radius: 23px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); font: inherit; font-size: 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background .18s, color .18s, border-color .18s, transform .14s; }
  .chip:hover { border-color: var(--teal); transform: translateY(-1px); }
  .chip .tick { width: 16px; height: 16px; border-radius: 8px; border: 1.5px solid var(--line);
    flex: 0 0 auto; position: relative; transition: background .18s, border-color .18s; }
  .chip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }
  .chip[aria-pressed="true"] .tick { background: #fff; border-color: #fff; }
  .chip[aria-pressed="true"] .tick::after { content: ""; position: absolute; left: 5px; top: 2px;
    width: 4px; height: 7px; border: solid var(--teal); border-width: 0 2px 2px 0; transform: rotate(45deg); }

  .two { display: flex; flex-wrap: wrap; gap: 12px; }
  .two > div { flex: 1 1 220px; min-width: 0; }

  /* ===== 우측 요약 ===== */
  .side { flex: 1 1 290px; min-width: 0; position: sticky; top: 92px; }
  .sum { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px;
    display: flex; flex-direction: column; gap: 18px; box-shadow: 0 2px 14px rgba(15,94,92,.06); }
  .sum h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .rows { display: flex; flex-direction: column; gap: 11px; }
  .r { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .r .k { color: var(--muted); flex: 0 0 auto; }
  .r .v { text-align: right; font-weight: 600; }
  .r.empty .v { color: #C2CBC9; font-weight: 400; }
  .hr { height: 1px; background: var(--line); }
  .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .total .k { font-size: 14px; color: var(--muted); }
  .total .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .pay { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 11px;
    background: var(--coral); color: #fff; font-size: 16px; font-weight: 700; border: 0; cursor: pointer;
    font-family: inherit; box-shadow: 0 2px 10px rgba(240,96,63,.22);
    transition: transform .18s, box-shadow .18s, background .18s; }
  .pay:hover { background: var(--coral-d); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(240,96,63,.3); }
  .pay:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: not-allowed; transform: none; }
  .note { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: var(--muted); }
  .note .chk { width: 17px; height: 17px; border-radius: 9px; background: var(--teal); flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
  .note .chk::after { content: ""; width: 4px; height: 7px; border: solid #fff;
    border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-.5px,-1px); }

  .agree { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .agree input { width: 19px; height: 19px; min-height: 19px; margin-top: 2px; flex: 0 0 auto; accent-color: var(--teal); }

  /* 계정 드롭다운 */
  .acctwrap { position: relative; }
  .acctbtn { position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 19px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; padding: 0;
    transition: border-color .18s, background .18s; }
  .acctbtn:hover { border-color: var(--teal); background: var(--mist); }
  .acctbtn[aria-expanded="true"] { border-color: var(--teal); background: var(--mist); }
  .acctbtn svg { width: 18px; height: 18px; fill: none; stroke: var(--teal); stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .dot-badge { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px;
    border-radius: 5px; background: var(--gold); border: 2px solid var(--bg); }

  .acctmenu { display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 30;
    min-width: 232px; padding: 8px; background: var(--card); border: 1px solid var(--line);
    border-radius: 13px; box-shadow: 0 8px 26px rgba(15,94,92,.14); }
  .acctmenu.open { display: block; animation: dropIn .18s ease both; }
  .acctmenu .who { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .acctmenu .who b { display: block; font-size: 14px; }
  .acctmenu .who span { font-size: 12.5px; color: var(--muted); }
  .acctmenu .pass { display: inline-flex; align-items: center; gap: 6px; margin-top: 7px;
    font-size: 12.5px; font-weight: 700; color: #fff; background: var(--gold);
    padding: 4px 11px; border-radius: 12px; }
  .acctmenu a, .acctmenu button { display: flex; align-items: center; gap: 9px; width: 100%;
    font: inherit; font-size: 14px; min-height: 42px; padding: 0 12px; border-radius: 8px;
    border: 0; background: transparent; color: var(--ink); cursor: pointer; text-align: left;
    text-decoration: none; transition: background .14s; }
  .acctmenu a:hover, .acctmenu button:hover { background: var(--mist); }
  .acctmenu svg { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .acctmenu .out { color: var(--muted); font-size: 13.5px; }

  /* 알림 */
  .toast { display: none; border-radius: 11px; padding: 14px 16px; font-size: 14.5px; font-weight: 600; }
  .toast.ok { background: var(--gold); color: #fff; }
  .toast.err { background: #8A3B3B; color: #fff; }
  .toast.info { background: var(--mist); color: var(--muted); }

  @media (max-width: 760px) {
    .side { position: static; }
    .main { padding: 28px 0 100px; gap: 26px; }
    .pstep .t { display: none; }
    .pline { margin: 0 8px; }
  }
  @media (max-width: 460px) {
    .wrap { padding-left: 16px; padding-right: 16px; }
    .slot { flex-wrap: wrap; }
    .slot .rk { flex: 0 0 auto; padding: 0 16px; min-height: 42px; }
    .slot .pair { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .chip:hover, .pay:hover { transform: none; }
  }
</style>
</head>
<body>


<header class="bar">
  <div class="wrap in">
    <a class="logo" href="index.html"><span class="dot"></span>CallBridge</a>
    <div style="display:flex; align-items:center; gap:9px; flex-wrap:wrap">
    <div class="acctwrap">
      <button type="button" class="acctbtn" id="acctBtn" aria-expanded="false" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        <span class="dot-badge" id="acctBadge" hidden></span>
      </button>
      <div class="acctmenu" id="acctMenu" role="menu"></div>
    </div>
    <div class="langwrap">
        <button type="button" class="langbtn" id="langBtn" aria-expanded="false" aria-haspopup="listbox">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
          <span id="langNow">日本語</span>
          <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <nav class="langs" id="langs" role="listbox" aria-label="Language"></nav>
      </div>
    </div>
  </div>
</header>

<div class="prog">
  <div class="wrap in">
    <div class="pstep on"><span class="n">1</span><span class="t" data-t="stepInput"></span></div>
    <span class="pline"></span>
    <div class="pstep"><span class="n">2</span><span class="t" data-t="stepPay"></span></div>
    <span class="pline"></span>
    <div class="pstep"><span class="n">3</span><span class="t" data-t="stepResult"></span></div>
  </div>
</div>

<main class="wrap main">

  <div class="form">

    <div class="opsNote" id="opsNote" style="display:none" role="status"></div>

    <div class="title">
      <h1 data-t="formTitle"></h1>
      <p data-t="formLead"></p>
    </div>

    <!-- 1 어디에 -->
    <section class="blk">
      <div class="blkhead"><span class="n">1</span><h2 data-t="b1"></h2></div>

      <div class="fld">
        <label for="vlink" data-t="linkLabel"></label>
        <input type="url" id="vlink" placeholder="https://naver.me/xxxxx">
        <p class="hint" data-t="linkHow"></p>
      </div>

      <div class="or"><i></i><span data-t="orTxt"></span><i></i></div>

      <div class="fld">
        <label for="venue" data-t="venueLabel"></label>
        <input type="text" id="venue">
      </div>
    </section>

    <!-- 2 언제 몇 명 -->
    <section class="blk">
      <div class="blkhead"><span class="n">2</span><h2 data-t="b2"></h2></div>

      <div>
        <label data-t="slotsLabel"></label>
        <div style="display:flex; flex-direction:column; gap:10px">
          <div class="slot">
            <span class="rk" data-t="r1"></span>
            <span class="pair"><input type="date" id="d1"><input type="time" id="t1" value="19:00"></span>
          </div>
          <div class="slot">
            <span class="rk" data-t="r2"></span>
            <span class="pair"><input type="date" id="d2"><input type="time" id="t2" value="13:00"></span>
          </div>
          <div class="slot">
            <span class="rk" data-t="r3"></span>
            <span class="pair"><input type="date" id="d3"><input type="time" id="t3" value="19:30"></span>
          </div>
        </div>
        <p class="hint" data-t="slotsHint"></p>
      </div>

      <div>
        <label data-t="partyLabel"></label>
        <div class="count">
          <button type="button" id="minus" aria-label="減らす">−</button>
          <span class="v" id="party">2</span>
          <button type="button" id="plus" aria-label="増やす">＋</button>
        </div>
      </div>

      <div>
        <label data-t="condLabel"></label>
        <div class="chips">
          <button type="button" class="chip" id="cTol" aria-pressed="true"><span class="tick"></span><span data-t="cTol"></span></button>
          <button type="button" class="chip" id="cSplit" aria-pressed="true"><span class="tick"></span><span data-t="cSplit"></span></button>
          <button type="button" class="chip" id="cSeat" aria-pressed="false"><span class="tick"></span><span data-t="cSeat"></span></button>
          <button type="button" class="chip" id="cCourse" aria-pressed="false"><span class="tick"></span><span data-t="cCourse"></span></button>
          <button type="button" class="chip" id="cLate" aria-pressed="true"><span class="tick"></span><span data-t="cLate"></span></button>
        </div>
        <p class="hint" data-t="condHint"></p>
      </div>
    </section>

    <!-- 3 누구 이름으로 -->
    <section class="blk">
      <div class="blkhead"><span class="n">3</span><h2 data-t="b3"></h2></div>

      <div class="two">
        <div class="fld">
          <label for="bname" data-t="nameLabel2"></label>
          <input type="text" id="bname" placeholder="Tanaka / Chen / Smith">
          <p class="hint" data-t="nameHint"></p>
        </div>
        <div class="fld">
          <label for="email" data-t="emailLabel"></label>
          <input type="email" id="email" placeholder="you@example.com">
        </div>
      </div>

      <div class="fld">
        <label for="note" data-t="noteLabel"></label>
        <textarea id="note" placeholder="例：ピーナッツアレルギーがあります／子ども1人を連れて行きます"></textarea>
        <p class="hint" data-t="noteHint"></p>
      </div>
    </section>

  </div>

  <!-- 요약 -->
  <aside class="side">
    <div class="sum">
      <h2 data-t="sumTitle"></h2>

      <div class="rows">
        <div class="r empty" id="sVenue"><span class="k" data-t="sVenueK"></span><span class="v" data-t="unfilled"></span></div>
        <div class="r empty" id="sSlot1"><span class="k" data-t="sSlot1K"></span><span class="v" data-t="unfilled"></span></div>
        <div class="r empty" id="sSlot2"><span class="k" data-t="sSlot2K"></span><span class="v" data-t="unfilled"></span></div>
        <div class="r"><span class="k" data-t="partyLabel"></span><span class="v" id="sumParty">2</span></div>
        <div class="r empty" id="sName"><span class="k" data-t="sNameK"></span><span class="v" data-t="unfilled"></span></div>
      </div>

      <div class="hr"></div>

      <div id="creditBox" style="display:none"></div>

      <div class="total"><span class="k" data-t="totalK"></span><span class="v" id="totalAmt">₩9,900</span></div>

      <label class="agree">
        <input type="checkbox" id="ok">
        <span data-t="aiConsent"></span>
      </label>

      <div class="toast" id="toast"></div>

      <button type="button" class="pay" id="pay" disabled data-t="submitBtn"></button>

      <div class="note"><span class="chk"></span><span data-t="refundShort"></span></div>
    </div>
  </aside>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  var T = {
    ja: {
      closedTitle: "ただいま新しいご依頼の受付をお休みしています",

          "<circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/></svg></div>" +
          "<h1>" + t("closedTitle") + "</h1>" +
          "<p>" + t("closedOff") + "</p>" + extra +
          "<a href='index.html'>" + t("closedBack") + "</a>" +
        "</div>";
      return;
    }

    if (!note) return;
    var msg = opsState.kind === "delay" ? t("noteDelay").replace("{n}", c.delay_hours || 24)
            : opsState.kind === "busy" ? t("noteBusy")
            : t("noteAfter").replace("{from}", hhmm(c.open_from));
    note.innerHTML =
      "<svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='9'/>" +
      "<path d='M12 7v5l3 2'/></svg>" +
      "<div><b>" + msg + "</b><span>" + t("noteTail") + "</span></div>";
    note.style.display = "flex";
  }

  function checkOpen() {
    if (TEST_MODE) return;   // 테스트 모드는 운영 상태와 무관하게 열어둔다

    api("ops_config?select=*&id=eq.1")
      .then(function (rs) {
        var c = (rs && rs[0]) || null;
        if (!c) return;

        if (c.mode === "paused") { opsState = { kind: "paused", cfg: c }; drawOps(); window.scrollTo(0, 0); return; }
        if (c.mode === "delay") { opsState = { kind: "delay", cfg: c }; drawOps(); return; }

        // 한국 시간 기준 현재 시각
        var kst = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
        var cur = kst.getHours() * 60 + kst.getMinutes();
        if (cur < toMin(c.open_from) || cur >= toMin(c.open_to)) {
          opsState = { kind: "after", cfg: c }; drawOps(); return;
        }

        // 오늘 접수 건수가 한도를 넘으면 '내일 이후 통화'로 안내한다 (접수는 받는다)
        if (!c.daily_limit || c.daily_limit < 1) return;
        var start = new Date(kst.getFullYear(), kst.getMonth(), kst.getDate());
        var iso = new Date(start.getTime() - (kst.getTime() - Date.now())).toISOString();

        fetch(cfg.url + "/rest/v1/requests?select=id&created_at=gte." + encodeURIComponent(iso) +
              "&service_type=neq.test", {
          headers: { "apikey": cfg.key, "Authorization": "Bearer " + cfg.key,
                     "Prefer": "count=exact", "Range": "0-0" }
        })
          .then(function (r) {
            var n = parseInt(((r.headers.get("content-range") || "0/0").split("/")[1]), 10) || 0;
            if (n >= c.daily_limit) { opsState = { kind: "busy", cfg: c }; drawOps(); }
          })
          .catch(function () {});
      })
      .catch(function () { /* 설정을 못 읽으면 평소대로 접수를 받는다 */ });
  }

  /* ---------- 접수 완료 화면 ---------- */
  function showDone(code) {
    var main = document.querySelector(".main");
    if (!main) return;
    main.innerHTML =
      "<div class='doneBox'>" +
        "<div class='doneIcon'></div>" +
        "<h1>" + t("doneTitle") + "</h1>" +
        "<p class='sub'>" + t("doneHow") + "</p>" +
        "<div class='codeCard'>" +
          "<span class='lbl'>" + t("doneCode") + "</span>" +
          "<strong id='theCode'>" + code + "</strong>" +
          "<button type='button' class='copy' id='copyCode'>" + t("doneCopy") + "</button>" +
        "</div>" +
        "<p class='warn2'>" + t("doneSave") + "</p>" +
        "<a class='pay' href='result.html#" + encodeURIComponent(code) + "'>" + t("doneGo") + "</a>" +
      "</div>";
    window.scrollTo(0, 0);

    $("copyCode").addEventListener("click", function () {
      navigator.clipboard.writeText(code).then(function () {
        $("copyCode").textContent = t("doneCopied");
      });
    });

    // 진행 표시를 2단계로
    var steps = document.querySelectorAll(".pstep");
    if (steps[1]) steps[1].classList.add("on");
    var lines = document.querySelectorAll(".pline");
    if (lines[0]) lines[0].classList.add("on");
  }

  /* ---------- 제출 ---------- */
  function collect() {
    var slots = [];
    [["d1","t1"],["d2","t2"],["d3","t3"]].forEach(function (p, i) {
      var d = $(p[0]).value, tm = $(p[1]).value;
      if (d && tm) slots.push({ rank: i + 1, slot_at: d + "T" + tm + ":00+09:00",
                                tolerance_min: chipOn("cTol") ? 30 : 0 });
    });
    var nm = ($("venue").value || "").trim();
    var lk = ($("vlink").value || "").trim();
    return {
      customer: { display_name: ($("bname").value || "").trim(),
                  email: ($("email").value || "").trim(), locale: lang },
      venue: { name: nm, link: lk },
      request: {
        venue_name_raw: (TEST_MODE ? "[TEST] " : "") + nm + (lk ? " | " + lk : ""),
        service_type: TEST_MODE ? "test" : "booking",
        party_size: party,
        booking_name: ($("bname").value || "").trim(),
        note_to_venue: ($("note").value || "").trim() || null,
        status: "received"
      },
      slots: slots,
      conditions: { split_seating: chipOn("cSplit"), course_only: chipOn("cCourse"),
                    seat_type_any: chipOn("cSeat"), late_arrival: chipOn("cLate") }
    };
  }

  function toast(kind, msg) {
    var el = $("toast");
    el.className = "toast " + kind;
    el.textContent = msg;
    el.style.display = "block";
  }

  $("pay").addEventListener("click", function () {
    var d = collect();
    if (!d.venue.name && !d.venue.link) { toast("err", t("errVenue")); return; }
    if (!d.slots.length) { toast("err", t("errSlot")); return; }

    $("pay").disabled = true;
    toast("info", t("saving"));

    var ids = { customer: uuid() };
    d.customer.id = ids.customer;

    api("customers", { method: "POST", body: d.customer, prefer: "return=minimal" })
      .then(function () {
        if (!d.venue.name) return [];
        var q = d.venue.name.replace(/\(.*?\)/g, "").trim().slice(0, 12);
        return api("venues?select=id&name=ilike.*" + encodeURIComponent(q) + "*&limit=1")
          .catch(function () { return []; });
      })
      .then(function (found) {
        d.request.customer_id = ids.customer;
        if (user) d.request.user_id = user.id;
        if (found && found.length) d.request.venue_id = found[0].id;
        return api("requests", { method: "POST", body: d.request });
      })
      .then(function (r) {
        ids.request = r[0].id;
        ids.code = r[0].lookup_code || "";
        // 패스를 썼다면 사용 횟수를 올린다
        if (useCredit && myCredit) {
          api("credits?id=eq." + myCredit.id, {
            method: "PATCH", prefer: "return=minimal",
            body: { used: myCredit.used + 1 }
          }).then(function () { loadCredits(); }).catch(function () {});
          api("requests?id=eq." + ids.request, {
            method: "PATCH", prefer: "return=minimal",
            body: { credit_id: myCredit.id }
          }).catch(function () {});
        }
        return api("request_slots", { method: "POST", prefer: "return=minimal",
          body: d.slots.map(function (s) { s.request_id = ids.request; return s; }) });
      })
      .then(function () {
        d.conditions.request_id = ids.request;
        return api("request_conditions", { method: "POST", body: d.conditions, prefer: "return=minimal" });
      })
      .then(function () {
        var showCode = ids.code || ids.request.slice(0, 8).toUpperCase();
        try {
          fetch(cfg.url + "/functions/v1/notify", {
            method: "POST",
            headers: { "Content-Type": "application/json", "apikey": cfg.key },
            body: JSON.stringify({ code: ids.code, venue: d.request.venue_name_raw,
                                   party: d.request.party_size, name: d.request.booking_name, lang: lang }),
            keepalive: true
          }).catch(function () {});
          fetch(cfg.url + "/rest/v1/visits", {
            method: "POST",
            headers: { "apikey": cfg.key, "Authorization": "Bearer " + cfg.key,
                       "Content-Type": "application/json", "Prefer": "return=minimal" },
            body: JSON.stringify({ event: "submit", page: "/intake.html", lang: lang,
                                   referrer: document.referrer ? document.referrer.slice(0, 200) : null }),
            keepalive: true
          }).catch(function () {});
        } catch (e) {}
        showDone(showCode);
      })
      .catch(function (e) { toast("err", t("failed") + e.message); $("pay").disabled = false; });
  });

  /* ---------- 테스트 배너 ---------- */
  if (TEST_MODE) {
    var bar = document.createElement("div");
    bar.id = "testBar";
    bar.style.cssText = "background:#C9962F;color:#2E2305;text-align:center;padding:9px 14px;" +
      "font-size:14px;font-weight:700";
    bar.setAttribute("data-t", "testBanner");
    document.body.insertBefore(bar, document.body.firstChild);
  }

  applyLang();
  initAuth();
  checkOpen();
})();
</script>
</body>
</html>
